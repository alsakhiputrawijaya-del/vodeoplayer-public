# Fly.io config for Playly Transcoder Worker
# Deploy: fly deploy

app = 'playly-transcoder'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'
  POLL_INTERVAL_MS = '10000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[mounts]]
  source = 'tmp_data'
  destination = '/tmp'
