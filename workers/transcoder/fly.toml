# Fly.io config untuk Playly Transcoder Worker
#
# Deploy:
#   cd workers/transcoder
#   fly launch --dockerfile Dockerfile --name playly-transcoder --region sin
#   fly secrets set NEXT_PUBLIC_SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... R2_... WEBHOOK_SECRET=...

app = 'playly-transcoder'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
