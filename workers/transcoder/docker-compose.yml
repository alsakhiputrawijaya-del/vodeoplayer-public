version: '3.8'

services:
  transcoder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: playly-transcoder
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
